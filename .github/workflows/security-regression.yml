name: Arcanam security regression
on:
  pull_request:
    paths:
      - 'web/src/main.js'
      - 'tests/password-change.test.cjs'
      - '.github/workflows/security-regression.yml'
  push:
    branches: [main]
    paths:
      - 'web/src/main.js'
      - 'tests/password-change.test.cjs'
      - '.github/workflows/security-regression.yml'
permissions:
  contents: read
jobs:
  password-change:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check web/src/main.js
      - name: Run regression checks
        run: node --test tests/password-change.test.cjs
